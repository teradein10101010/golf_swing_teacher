services:
  backend:
    build: .
    container_name: golf-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/videos:/app/backend/videos

  frontend:
    build: ./frontend
    container_name: golf-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
