services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: golf-backend
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app/backend
    env_file:
      - ./apps/backend/.env

  frontend:
    build: ./apps/frontend
    container_name: golf-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://192.168.10.118:8000
      - VITE_FREE_ACCESS=1
    depends_on:
      - backend
