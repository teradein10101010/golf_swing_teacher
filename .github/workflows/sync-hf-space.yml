name: Sync GitHub Main to HF Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_SPACE_REPO: spaces/teradein1010/golf_swing_analyser
      HF_USERNAME: teradein1010
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is not set. Add it in GitHub repo secrets."
            exit 1
          fi

          SYNC_DIR="$(mktemp -d)"
          rsync -a --delete ./ "$SYNC_DIR/" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".idea/" \
            --exclude "data/*.mp4" \
            --exclude "backend/videos/*.mp4" \
            --exclude "backend/videos/*.raw.mp4"

          cd "$SYNC_DIR"
          git init
          git checkout -b main
          git add -A
          git commit -m "Sync from GitHub main ${GITHUB_SHA}"
          git remote add hf "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/${HF_SPACE_REPO}"
          git push hf main:main --force
